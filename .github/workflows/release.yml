name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows release
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(\d+\.\d+\.\d+)"' | Select-Object -First 1
          if (-not $match) { throw 'Cargo package version was not found.' }
          $version = $match.Matches[0].Groups[1].Value
          $shortVersion = $version -replace '\.0$', ''
          if ($env:RELEASE_TAG -notin @("v$version", "v$shortVersion")) {
            throw "Tag $env:RELEASE_TAG does not match Cargo version $version."
          }
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Build release programs
        run: cargo build --release --locked --bin pic_process --bin firstcut-ui --bin pic_process-gallery --bin pic_process-tune
      - name: Package programs and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $names = @('pic_process.exe', 'firstcut-ui.exe', 'pic_process-gallery.exe', 'pic_process-tune.exe')
          foreach ($name in $names) {
            Copy-Item -LiteralPath "target/release/$name" -Destination "dist/$name"
          }
          $checksums = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines('dist/SHA256SUMS.txt', [string[]]$checksums)
      - name: Save build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firstcut-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-container-platform:
    name: Build and publish Linux ${{ matrix.arch }} image
    if: github.event_name == 'push'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Smoke test the published image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ steps.version.outputs.value }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          photos="$RUNNER_TEMP/firstcut-smoke-photos"
          mkdir -p "$photos"
          container=firstcut-container-smoke
          cleanup() {
            docker stop "$container" >/dev/null 2>&1 || true
            docker rm "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$container" \
            --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:18787:8787 \
            -v "$photos:/photos" \
            "$IMAGE:$IMAGE_TAG" review /photos --bind 0.0.0.0 --port 8787 --no-browser
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18787/ >/dev/null; then
              echo 'Container review UI returned HTTP 200.'
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

  publish-container-manifest:
    name: Publish multi-architecture image tags
    if: github.event_name == 'push'
    needs: publish-container-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create versioned and latest multi-arch tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$image:$version" \
            "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools create \
            --tag "$image:latest" \
            "$image:$version-amd64" "$image:$version-arm64"

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [build, publish-container-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: firstcut-windows-x64
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/pic_process.exe \
            dist/firstcut-ui.exe \
            dist/pic_process-gallery.exe \
            dist/pic_process-tune.exe \
            dist/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes \
            --title "firstcut $RELEASE_TAG"
