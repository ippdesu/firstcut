name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firstcut-release
  cancel-in-progress: false

jobs:
  verify:
    name: Require green checks on main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          for workflow in ci.yml codeql.yml; do
            result=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$GITHUB_SHA" \
              --jq '.workflow_runs[0].conclusion // "missing"')
            if [ "$result" != success ]; then
              printf '%s on the release commit must pass first (current: %s).\n' "$workflow" "$result" >&2
              exit 1
            fi
          done

  build:
    name: Build Windows release
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped')) }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check tag matches Cargo version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(\d+\.\d+\.\d+)"' | Select-Object -First 1
          if (-not $match) { throw 'Cargo package version was not found.' }
          $version = $match.Matches[0].Groups[1].Value
          $shortVersion = $version -replace '\.0$', ''
          if ($env:RELEASE_TAG -notin @("v$version", "v$shortVersion")) {
            throw "Tag $env:RELEASE_TAG does not match Cargo version $version."
          }
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Install Rust binary audit tools
        run: cargo install --locked cargo-auditable@0.7.7 cargo-audit@0.23.0
      - name: Build release programs with dependency metadata
        run: cargo auditable build --release --locked --bin pic_process --bin firstcut-ui --bin pic_process-gallery --bin pic_process-tune
      - name: Audit Rust dependencies embedded in the release programs
        run: cargo audit --deny warnings bin target/release/pic_process.exe target/release/firstcut-ui.exe target/release/pic_process-gallery.exe target/release/pic_process-tune.exe
      - name: Smoke test the Windows release binary
        run: python .github/scripts/check-review.py --binary target/release/pic_process.exe
      - name: Package programs and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $names = @('pic_process.exe', 'firstcut-ui.exe', 'pic_process-gallery.exe', 'pic_process-tune.exe')
          foreach ($name in $names) {
            Copy-Item -LiteralPath "target/release/$name" -Destination "dist/$name"
          }
          $checksums = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines('dist/SHA256SUMS.txt', [string[]]$checksums)
      - name: Save build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firstcut-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-container-platform:
    name: Scan and stage both Linux images
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/container.yml
    with:
      staging: true
    permissions:
      contents: read
      packages: write

  publish-container-manifest:
    name: Publish multi-architecture image tags
    if: github.event_name == 'push'
    needs: publish-container-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download scanned image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: firstcut-digest-*
          merge-multiple: true
          path: digests
      - name: Assemble the multi-architecture manifest from scanned images
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          staging="$image:staging-index-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          read -r amd64 < digests/firstcut-amd64.digest
          read -r arm64 < digests/firstcut-arm64.digest
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$staging" "$image@$amd64" "$image@$arm64"
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\ndigest=%s\namd64=%s\narm64=%s\n' "$image" "$digest" "$amd64" "$arm64" >> "$GITHUB_OUTPUT"
      - name: Attest the compiled container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Promote the attested digest and both scanned platforms
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          AMD64: ${{ steps.manifest.outputs.amd64 }}
          ARM64: ${{ steps.manifest.outputs.arm64 }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$version-amd64" \
            --tag "$IMAGE:latest-amd64" "$IMAGE@$AMD64"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$version-arm64" \
            --tag "$IMAGE:latest-arm64" "$IMAGE@$ARM64"
          docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [build, publish-container-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: firstcut-windows-x64
          path: dist
      - name: Attest Windows release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.exe
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/pic_process.exe \
            dist/firstcut-ui.exe \
            dist/pic_process-gallery.exe \
            dist/pic_process-tune.exe \
            dist/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes \
            --title "firstcut $RELEASE_TAG"
