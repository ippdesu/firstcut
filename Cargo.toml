[package]
name = "pic_process"
version = "1.3.0"
edition = "2021"
description = "索尼照片初筛与本地复核工具"
autobins = false  # 关闭 src/bin/ 的自动发现，统一由下方 [[bin]] 列表控制

# CLI 子工具统一以 pic_process- 为前缀；firstcut-ui 是面向双击启动的 Windows UI 启动器。
[[bin]]
name = "pic_process"
path = "src/main.rs"

[[bin]]
name = "firstcut-ui"
path = "src/bin/firstcut_ui.rs"

[[bin]]
name = "pic_process-tune"
path = "src/bin/tune.rs"

[[bin]]
name = "pic_process-gallery"
path = "src/bin/gallery.rs"

[[bin]]
name = "pic_process-debug-pose"
path = "src/bin/debug_pose.rs"

[[bin]]
name = "pic_process-debug-scrfd"
path = "src/bin/debug_scrfd.rs"

[[bin]]
name = "pic_process-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "pic_process-debug-exposure"
path = "src/bin/debug_exposure.rs"

[features]
# 实验性 DirectML GPU 推理（score --gpu）。默认关闭：
# 不改变"主二进制静态链接、单文件免 DLL"的交付承诺。
gpu = ["ort/directml"]

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
csv = "1"
image = "0.25"
kamadak-exif = "0.5"
ndarray = "0.17"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
jpeg-decoder = "0.3"
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
toml_edit = "0.22"
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17.2", default-features = false }
