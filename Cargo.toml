[package]
name = "pic_process"
version = "0.1.0"
edition = "2021"
description = "索尼照片初筛评分工具（Phase 1: 扫描/评分/报告）"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
image = "0.25"
kamadak-exif = "0.5"
ndarray = "0.17"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
jpeg-decoder = "0.3"
