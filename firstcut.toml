# ============================================================
# firstcut 评分配置模板
# 用法: pic_process score <目录> --config 本文件
# 可多场景存多份轮着用: 人像.toml / 打鸟.toml / 夜景.toml / 飞机.toml
# 只写想改的字段即可，未写的字段用默认值
# ============================================================

# [weights] 五维评分权重（总和应约等于 1.0，偏差超过 0.05 会拒绝加载）
[weights]
# 清晰度：主体（人脸/头部）是否合焦。对焦失败是打鸟/飞机/运动的主要废片
#   原因 → 这类场景调高（0.40~0.45）；人像大光圈虚化背景不会被误判
#   （主体感知指标），可维持或略降。
sharpness = 0.35
# 曝光：过曝/欠曝比例 + 亮度偏离目标（exposure_target）。白天顺光 → 调高
#   至 0.25~0.30 让欠曝照片沉底；夜景/暗调创作 → 调低至 0.10~0.15。
exposure = 0.2
# 噪点：暗部噪声 + ISO 容忍度。高 ISO 打鸟/室内 → 调低（更宽容）；
#   追求画质的低 ISO 场景 → 调高。
noise = 0.15
# 构图：主体在三分法位置与画面占比（基于人脸/人体检测）。人像 → 调高至
#   0.20~0.25；动物/飞机（无主体检测时给中性分）→ 调低。
composition = 0.15
# 美学：CLIPIQA 主观美感分。风光/人文 → 可调高；记录性内容（翻拍/素材）→ 调低。
aesthetic = 0.15

# [metric] 评分曲线与输出参数
[metric]
# 清晰度饱和常数：越大对轻微模糊越宽容（分数分布更靠上），越小越严格。
sharpness_k = 800000
# 噪点容忍基准：越大越宽容噪点（高 ISO 照片分数更高）。
noise_k0 = 3
# 曝光理想平均亮度（0-255）：暗调环境（夜景/黄昏/室内）可调低如 90，
# 亮调环境（雪景/正午海边）可调高如 150。
exposure_target = 128
# 星级分档：总分 ≥ 阈值得对应星数（XMP xmp:Rating，Lightroom 可读）
rating_5 = 75
rating_4 = 60
rating_3 = 45
rating_2 = 30
